<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#16a34a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="CoffeeIT"/>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"/>
<link rel="manifest" href="manifest.webmanifest"/>
<title>CoffeeIT — доска объявлений: купить, продать, договориться</title>
<meta name="description" content="CoffeeIT — бесплатная доска объявлений. Размещайте товары, переписывайтесь с покупателями, договаривайтесь о встрече, доставке или перевозке."/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%2316a34a'/%3E%3Ctext x='50' y='70' font-size='58' font-weight='bold' text-anchor='middle' fill='%23fff'%3EC%3C/text%3E%3C/svg%3E"/>
<link rel="stylesheet" href="/css/app.css"/>
</head>
<body>

<a class="skip-link" href="#app">Перейти к содержимому</a>
<header class="header">
  <div class="container header-inner">
    <a class="logo" href="/" data-link>
      <span class="coin">C</span>
      <span class="logo-text">CoffeeIT<small>доска объявлений</small></span>
    </a>

    <form class="search" id="header-search" autocomplete="off">
      <input type="search" name="q" placeholder="Что искать? Например, iPhone или диван" aria-label="Поиск объявлений"/>
      <button type="submit" class="btn btn-primary" aria-label="Найти">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Найти</span>
      </button>
    </form>

    <nav class="header-actions">
      <button type="button" class="btn btn-sm" data-stories-dev title="Сторис (в разработке)" style="gap:6px;border-color:rgba(225,48,108,.35);background:linear-gradient(135deg,rgba(245,133,41,.10),rgba(221,42,123,.10),rgba(129,52,175,.10))">
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af)"></span>
        <span>Сторис</span>
        <span style="font-size:10px;padding:1px 6px;border-radius:999px;background:var(--bg2);color:var(--muted);font-weight:600">в разработке</span>
      </button>
      <button class="icon-btn" id="theme-toggle" title="Сменить тему" aria-label="Сменить тему">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>
      </button>
      <a class="icon-btn" href="/favorites" data-link title="Избранное" aria-label="Избранное">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.5-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.5-7 9-7 9Z"/></svg>
      </a>
      <a class="icon-btn" href="/chats" data-link title="Сообщения" aria-label="Сообщения">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-5.5A8 8 0 1 1 21 12Z"/></svg>
        <span class="badge" id="unread-badge" hidden>0</span>
      </a>
      <div class="user-slot" id="user-slot"></div>
      <a class="btn btn-primary btn-post" href="/new" data-link>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <span>Разместить</span>
      </a>
    </nav>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="footer">
  <div class="container footer-inner">
    <div>
      <div class="logo small"><span class="coin">C</span><span class="logo-text">CoffeeIT</span></div>
    </div>
    <div class="footer-links">
      <a href="/" data-link>Объявления</a>
      <a href="/chats" data-link>Сообщения</a>
      <a href="/deals" data-link>Сделки</a>
      <a href="/favorites" data-link>Избранное</a>
      <button type="button" class="btn btn-sm" data-open-designs style="gap:6px">🎨 10 дизайнов</button>
      <button type="button" class="btn btn-sm" data-support-project style="gap:6px">❤️ Поддержать проект</button>
      <button type="button" class="btn btn-sm" data-install-ios style="gap:6px">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.572-2.27 1.206-2.98.804-.94 2.142-1.64 3.248-1.68.03.13.05.28.05.43zm4.565 15.71c-.03.07-.463 1.58-1.518 3.12-.945 1.34-1.94 2.71-3.43 2.71-1.517 0-1.9-.88-3.63-.88-1.698 0-2.302.91-3.67.91-1.377 0-2.332-1.26-3.428-2.8-1.287-1.82-2.323-4.63-2.323-7.28 0-4.28 2.797-6.55 5.552-6.55 1.448 0 2.675.95 3.6.95.865 0 2.222-1.01 3.902-1.01.613 0 2.886.06 4.374 2.19-.13.09-2.383 1.37-2.383 4.19 0 3.26 2.854 4.42 2.955 4.45z"/></svg>
        <span>Скачать для iOS</span>
      </button>
    </div>
  </div>
</footer>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/views.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
